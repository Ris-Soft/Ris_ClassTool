<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>计算器项目</title>
  <link rel="stylesheet" href="assets/project.css">
</head>
<body>
  <div class="project-container">
    <div class="project-header">
      <div class="project-icon">🧮</div>
      <h2 class="project-title">计算器工具</h2>
      <p class="project-description">
        这是一个简单的计算器工具，支持基本的数学运算。
      </p>
    </div>
    
    <div class="project-actions">
      <button class="action-btn primary" onclick="openCalculator()">
        <span class="btn-icon">🖩</span>
        打开计算器
      </button>
      <button class="action-btn secondary" onclick="showAbout()">
        <span class="btn-icon">ℹ️</span>
        关于插件
      </button>
      <button class="action-btn accent" onclick="createShortcut()">
        <span class="btn-icon">🔗</span>
        创建快捷方式
      </button>
    </div>
    
    <div class="project-features">
      <h3 class="features-title">功能特点</h3>
      <div class="features-grid">
        <div class="feature-item">
          <div class="feature-icon">➕</div>
          <div class="feature-text">基本四则运算</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">⌨️</div>
          <div class="feature-text">键盘快捷键操作</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🎨</div>
          <div class="feature-text">简洁美观界面</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">⚡</div>
          <div class="feature-text">实时计算结果</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🔗</div>
          <div class="feature-text">桌面快捷方式</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📱</div>
          <div class="feature-text">响应式设计</div>
        </div>
      </div>
    </div>
    
    <div class="project-info">
      <div class="info-item">
        <span class="info-label">版本:</span>
        <span class="info-value">1.0.0</span>
      </div>
      <div class="info-item">
        <span class="info-label">作者:</span>
        <span class="info-value">LessonPlugin</span>
      </div>
      <div class="info-item">
        <span class="info-label">类型:</span>
        <span class="info-value">工具插件</span>
      </div>
    </div>
  </div>
  
  <script src="assets/project.js"></script>
</body>
</html>
